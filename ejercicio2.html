<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 02 - Naves SWAPI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Ejercicio 02</h1>
      <p>Buscador de Naves Espaciales SWAPI</p>
    </header>

    <nav>
      <a href="index.html">← Inicio</a>
      <a href="ejercicio1.html">Ejercicio 1</a>
      <a href="ejercicio2.html" class="active">Ejercicio 2</a>
      <a href="ejercicio3.html">Ejercicio 3</a>
      <a href="ejercicio4.html">Ejercicio 4</a>
    </nav>

    <main class="card">
      <h2>Consultar Nave por ID</h2>
      <div class="input-group">
        <input type="number" id="starshipId" placeholder="Ejemplo: 9" min="1" />
        <button id="btnBuscar">Buscar</button>
      </div>
      <div id="starshipResult" class="result-box">
        Ingrese un ID para buscar información de la nave.
      </div>
    </main>

    <script>
      document
        .getElementById("btnBuscar")
        .addEventListener("click", async () => {
          const id = document.getElementById("starshipId").value;
          const resultDiv = document.getElementById("starshipResult");

          if (!id) {
            resultDiv.innerHTML = `<p class="error">Por favor, ingrese un ID válido.</p>`;
            return;
          }

          try {
            resultDiv.innerHTML = `<p>Cargando información...</p>`;
            const response = await fetch(
              `https://swapi.dev/api/starships/${id}/`,
            );

            if (!response.ok) {
              throw new Error("El ID de la nave no existe.");
            }

            const data = await response.json();

            resultDiv.innerHTML = `
                    <p><strong>Nombre:</strong> ${data.name}</p>
                    <p><strong>Modelo:</strong> ${data.model}</p>
                    <p><strong>Fabricante:</strong> ${data.manufacturer}</p>
                    <p><strong>Costo en créditos:</strong> ${data.cost_in_credits}</p>
                    <p><strong>Clase de nave:</strong> ${data.starship_class}</p>
                `;
          } catch (error) {
            resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
          }
        });
    </script>
  </body>
</html>
