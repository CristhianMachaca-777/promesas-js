<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 01 - Planetas SWAPI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Ejercicio 01</h1>
      <p>Buscador de Planetas SWAPI</p>
    </header>

    <nav>
      <a href="index.html">← Inicio</a>
      <a href="ejercicio1.html" class="active">Ejercicio 1</a>
      <a href="ejercicio2.html">Ejercicio 2</a>
      <a href="ejercicio3.html">Ejercicio 3</a>
      <a href="ejercicio4.html">Ejercicio 4</a>
    </nav>

    <main class="card">
      <h2>Consultar Planeta por ID</h2>
      <div class="input-group">
        <input type="number" id="planetId" placeholder="Ejemplo: 3" min="1" />
        <button id="btnBuscar">Buscar</button>
      </div>
      <div id="planetResult" class="result-box">
        Ingrese un ID para buscar información del planeta.
      </div>
    </main>

    <script>
      document
        .getElementById("btnBuscar")
        .addEventListener("click", async () => {
          const id = document.getElementById("planetId").value;
          const resultDiv = document.getElementById("planetResult");

          if (!id) {
            resultDiv.innerHTML = `<p class="error">Por favor, ingrese un ID válido.</p>`;
            return;
          }

          try {
            resultDiv.innerHTML = `<p>Cargando información...</p>`;
            const response = await fetch(
              `https://swapi.dev/api/planets/${id}/`,
            );

            if (!response.ok) {
              throw new Error("El ID de planeta ingresado no existe.");
            }

            const data = await response.json();

            // Formulario/Resultados mostrando 5 campos del JSON
            resultDiv.innerHTML = `
                    <p><strong>Nombre:</strong> ${data.name}</p>
                    <p><strong>Clima:</strong> ${data.climate}</p>
                    <p><strong>Terreno:</strong> ${data.terrain}</p>
                    <p><strong>Población:</strong> ${data.population}</p>
                    <p><strong>Periodo orbital:</strong> ${data.orbital_period} días</p>
                `;
          } catch (error) {
            resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
          }
        });
    </script>
  </body>
</html>
