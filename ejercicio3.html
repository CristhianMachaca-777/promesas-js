<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 03 - API Dragon Ball</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Ejercicio 03</h1>
      <p>Buscador de Personajes Dragon Ball</p>
    </header>

    <nav>
      <a href="index.html">← Inicio</a>
      <a href="ejercicio1.html">Ejercicio 1</a>
      <a href="ejercicio2.html">Ejercicio 2</a>
      <a href="ejercicio3.html" class="active">Ejercicio 3</a>
      <a href="ejercicio4.html">Ejercicio 4</a>
    </nav>

    <main class="card">
      <h2>Consultar Personaje por ID</h2>
      <div class="input-group">
        <input type="number" id="dbId" placeholder="Ejemplo: 1" min="1" />
        <button id="btnBuscar">Buscar</button>
      </div>
      <div id="dbResult" class="result-box">
        Ingrese un ID para buscar personaje.
      </div>
    </main>

    <script>
      document
        .getElementById("btnBuscar")
        .addEventListener("click", async () => {
          const id = document.getElementById("dbId").value;
          const resultDiv = document.getElementById("dbResult");

          if (!id) {
            resultDiv.innerHTML = `<p class="error">Por favor, ingrese un ID válido.</p>`;
            return;
          }

          try {
            resultDiv.innerHTML = `<p>Cargando información...</p>`;
            const response = await fetch(
              `https://dragonball-api.com/api/characters/${id}`,
            );

            if (!response.ok) {
              throw new Error("El ID del personaje no fue encontrado.");
            }

            const data = await response.json();

            // Muestra Nombre, Descripción e Imagen
            resultDiv.innerHTML = `
                    <p><strong>Nombre:</strong> ${data.name}</p>
                    <p><strong>Descripción:</strong> ${data.description}</p>
                    <img src="${data.image}" alt="${data.name}">
                `;
          } catch (error) {
            resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
          }
        });
    </script>
  </body>
</html>
